<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator - Spribe Gaming</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0e14; color: #ffffff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glow-red { text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none pb-4">

    <!-- TOP HEADER (Exact Screenshot Parity) -->
    <header class="bg-[#121622] border-b border-gray-800 px-3 py-2 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-2.5">
            <button class="w-7 h-7 bg-[#1c2333] rounded-lg flex items-center justify-center text-gray-300 hover:text-white border border-gray-700">
                <i class="fa-solid fa-house text-xs"></i>
            </button>
            <span class="text-lg font-black tracking-wider text-red-500 italic">Aviator</span>
        </div>
        <div class="flex items-center space-x-3">
            <span id="headerBalance" class="text-xs font-bold text-gray-200">0.32 INR</span>
            <button class="text-gray-400 hover:text-white"><i class="fa-regular fa-comment-dots text-base"></i></button>
            <button class="text-gray-400 hover:text-white"><i class="fa-solid fa-bars text-base"></i></button>
        </div>
    </header>

    <!-- RECENT MULTIPLIERS BAR -->
    <div class="bg-[#0b0e14] px-2 py-1.5 flex items-center space-x-2 overflow-x-auto no-scrollbar border-b border-gray-900">
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-blue-400 border border-gray-800">2.51x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-green-400 border border-gray-800">1.10x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-green-400 border border-gray-800">1.25x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-green-400 border border-gray-800">1.12x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-purple-400 border border-gray-800">22.74x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-blue-400 border border-gray-800">5.14x</span>
        <span class="bg-[#181f2c] px-2.5 py-0.5 rounded-full text-[11px] font-bold text-green-400 border border-gray-800">1.86x</span>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <main class="flex-grow max-w-md w-full mx-auto p-2 space-y-2 overflow-y-auto">

        <!-- GAME CANVAS ARENA -->
        <div class="relative bg-gradient-to-tr from-[#16121d] via-[#101420] to-[#0b0e14] border border-gray-800 rounded-2xl overflow-hidden shadow-2xl h-56 flex flex-col items-center justify-center">
            <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-10"></canvas>
            <div id="gameStatusDisplay" class="z-20 text-center">
                <div id="multiplierValue" class="text-5xl font-black tracking-wider text-white glow-red">1.10x</div>
                <div id="gameStatusText" class="text-[10px] tracking-widest uppercase text-gray-400 mt-1">FLYING...</div>
            </div>
            <!-- Live Online Ticker Badge -->
            <div class="absolute bottom-2 right-2 z-20 bg-black/40 backdrop-blur-md px-2.5 py-1 rounded-full border border-gray-800 flex items-center space-x-1.5 text-[10px] text-gray-300">
                <div class="flex -space-x-1">
                    <span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block border border-black"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-yellow-500 inline-block border border-black"></span>
                    <span class="w-3.5 h-3.5 rounded-full bg-green-500 inline-block border border-black"></span>
                </div>
                <span class="font-bold">3,187</span>
            </div>
        </div>

        <!-- DUAL BETTING PANEL 1 -->
        <div class="bg-[#121622] border border-gray-800 rounded-2xl p-3 space-y-2.5 shadow-xl">
            <!-- Bet / Auto Tabs -->
            <div class="flex bg-[#0b0e14] p-0.5 rounded-xl border border-gray-800 text-xs font-bold">
                <button class="flex-1 py-1 rounded-lg bg-[#1f2636] text-white shadow">Bet</button>
                <button class="flex-1 py-1 rounded-lg text-gray-400">Auto</button>
            </div>
            <!-- Input & Chips Row -->
            <div class="grid grid-cols-2 gap-2 items-center">
                <div class="flex items-center bg-[#0b0e14] border border-gray-800 rounded-xl px-2 py-1.5">
                    <button onclick="adjustBet(1, -10)" class="text-gray-400 hover:text-white px-1 text-sm font-bold"><i class="fa-solid fa-minus"></i></button>
                    <input type="text" id="betInput1" value="10.00" class="w-full bg-transparent text-center text-white font-extrabold text-sm focus:outline-none">
                    <button onclick="adjustBet(1, 10)" class="text-gray-400 hover:text-white px-1 text-sm font-bold"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-1">
                    <button onclick="setBetVal(1, 100)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">100</button>
                    <button onclick="setBetVal(1, 200)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">200</button>
                    <button onclick="setBetVal(1, 500)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">500</button>
                    <button onclick="setBetVal(1, 1000)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">1,000</button>
                </div>
            </div>
            <!-- Action Button -->
            <button id="betBtn1" onclick="toggleBet(1)" class="w-full py-3 rounded-xl font-black uppercase tracking-wider bg-green-600 hover:bg-green-500 transition shadow-lg text-white text-sm">
                Bet <span id="betBtnText1">10.00 INR</span>
            </button>
        </div>

        <!-- DUAL BETTING PANEL 2 -->
        <div class="bg-[#121622] border border-gray-800 rounded-2xl p-3 space-y-2.5 shadow-xl">
            <!-- Bet / Auto Tabs -->
            <div class="flex bg-[#0b0e14] p-0.5 rounded-xl border border-gray-800 text-xs font-bold">
                <button class="flex-1 py-1 rounded-lg bg-[#1f2636] text-white shadow">Bet</button>
                <button class="flex-1 py-1 rounded-lg text-gray-400">Auto</button>
            </div>
            <!-- Input & Chips Row -->
            <div class="grid grid-cols-2 gap-2 items-center">
                <div class="flex items-center bg-[#0b0e14] border border-gray-800 rounded-xl px-2 py-1.5">
                    <button onclick="adjustBet(2, -10)" class="text-gray-400 hover:text-white px-1 text-sm font-bold"><i class="fa-solid fa-minus"></i></button>
                    <input type="text" id="betInput2" value="10.00" class="w-full bg-transparent text-center text-white font-extrabold text-sm focus:outline-none">
                    <button onclick="adjustBet(2, 10)" class="text-gray-400 hover:text-white px-1 text-sm font-bold"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-1">
                    <button onclick="setBetVal(2, 100)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">100</button>
                    <button onclick="setBetVal(2, 200)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">200</button>
                    <button onclick="setBetVal(2, 500)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">500</button>
                    <button onclick="setBetVal(2, 1000)" class="bg-[#1b2230] hover:bg-[#252f42] py-1.5 rounded-lg text-[11px] font-bold text-gray-300 border border-gray-800">1,000</button>
                </div>
            </div>
            <!-- Action Button -->
            <button id="betBtn2" onclick="toggleBet(2)" class="w-full py-3 rounded-xl font-black uppercase tracking-wider bg-green-600 hover:bg-green-500 transition shadow-lg text-white text-sm">
                Bet <span id="betBtnText2">10.00 INR</span>
            </button>
        </div>

        <!-- BOTTOM STATS TAB BAR -->
        <div class="bg-[#121622] border border-gray-800 rounded-2xl p-2.5 space-y-2">
            <div class="flex justify-around text-xs font-bold text-gray-400 border-b border-gray-800 pb-2">
                <button class="text-white border-b-2 border-red-500 pb-1">All Bets</button>
                <button class="hover:text-white pb-1">Previous</button>
                <button class="hover:text-white pb-1">Top</button>
            </div>
            <div class="flex justify-between items-center text-xs px-1">
                <div class="flex items-center space-x-1.5">
                    <span class="w-4 h-4 rounded-full bg-red-500 inline-block"></span>
                    <span class="text-gray-300 font-bold">5530/5515 Bets</span>
                </div>
                <div class="text-right">
                    <span class="text-gray-400 text-[10px]">Total win INR</span>
                    <div class="text-white font-black text-sm">0.00</div>
                </div>
            </div>
        </div>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-gray-900 border border-gray-700 text-white px-3 py-1.5 rounded-xl shadow-2xl text-xs font-bold z-50 hidden"></div>

    <!-- SCRIPT ENGINE -->
    <script>
        let balance = 0.32;
        let gameActive = true;
        let currentMultiplier = 1.10;
        let crashMultiplier = 3.50;
        let betPlaced1 = false;
        let betPlaced2 = false;

        function updateUI() {
            document.getElementById('headerBalance').innerText = balance.toFixed(2) + " INR";
            document.getElementById('betBtnText1').innerText = parseFloat(document.getElementById('betInput1').value).toFixed(2) + " INR";
            document.getElementById('betBtnText2').innerText = parseFloat(document.getElementById('betInput2').value).toFixed(2) + " INR";
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function setBetVal(box, amt) {
            document.getElementById('betInput' + box).value = amt.toFixed(2);
            updateUI();
        }

        function adjustBet(box, delta) {
            const input = document.getElementById('betInput' + box);
            let val = parseFloat(input.value) + delta;
            if(val < 10) val = 10;
            input.value = val.toFixed(2);
            updateUI();
        }

        function toggleBet(box) {
            const amt = parseFloat(document.getElementById('betInput' + box).value);
            if(balance < amt) {
                showToast("Insufficient Balance!");
                return;
            }
            if(box === 1) {
                betPlaced1 = !betPlaced1;
                const btn = document.getElementById('betBtn1');
                if(betPlaced1) {
                    balance -= amt; updateUI();
                    btn.innerText = "CANCEL";
                    btn.className = "w-full py-3 rounded-xl font-black uppercase tracking-wider bg-red-600 hover:bg-red-500 transition shadow-lg text-white text-sm";
                } else {
                    balance += amt; updateUI();
                    btn.innerText = "BET " + amt.toFixed(2) + " INR";
                    btn.className = "w-full py-3 rounded-xl font-black uppercase tracking-wider bg-green-600 hover:bg-green-500 transition shadow-lg text-white text-sm";
                }
            } else {
                betPlaced2 = !betPlaced2;
                const btn = document.getElementById('betBtn2');
                if(betPlaced2) {
                    balance -= amt; updateUI();
                    btn.innerText = "CANCEL";
                    btn.className = "w-full py-3 rounded-xl font-black uppercase tracking-wider bg-red-600 hover:bg-red-500 transition shadow-lg text-white text-sm";
                } else {
                    balance += amt; updateUI();
                    btn.innerText = "BET " + amt.toFixed(2) + " INR";
                    btn.className = "w-full py-3 rounded-xl font-black uppercase tracking-wider bg-green-600 hover:bg-green-500 transition shadow-lg text-white text-sm";
                }
            }
        }

        // Canvas Red Plane Animation Engine
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawRedAirplane(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-0.25);
            
            // Fuselage
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.ellipse(0, 0, 32, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wings
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(-4, -22);
            ctx.lineTo(8, -4);
            ctx.lineTo(-8, -4);
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#93c5fd';
            ctx.beginPath();
            ctx.ellipse(8, -2, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Propeller
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(30, -7, 2, 14);

            ctx.restore();
        }

        let gameTimer = 4;
        function runGameEngine() {
            if(!gameActive) {
                gameTimer -= 1;
                document.getElementById('gameStatusText').innerText = `NEXT ROUND IN ${gameTimer}s`;
                document.getElementById('multiplierValue').innerText = "1.00x";
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Red Ramp Platform
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(0, canvas.height - 25, 50, 25);

                if(gameTimer <= 0) {
                    gameActive = true;
                    currentMultiplier = 1.00;
                    crashMultiplier = (Math.random() * 3 + 1.30).toFixed(2);
                    gameTimer = 4;
                }
            } else {
                currentMultiplier += 0.035;
                document.getElementById('multiplierValue').innerText = currentMultiplier.toFixed(2) + 'x';
                document.getElementById('gameStatusText').innerText = "FLYING...";

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Red Curve Trajectory
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                let currentX = Math.min(canvas.width * 0.70, canvas.width * (currentMultiplier / 5));
                let currentY = Math.max(35, canvas.height - (canvas.height * (currentMultiplier / 5)));
                ctx.quadraticCurveTo(currentX * 0.4, canvas.height, currentX, currentY);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Airplane
                drawRedAirplane(currentX, currentY);

                if(currentMultiplier >= crashMultiplier) {
                    gameActive = false;
                    document.getElementById('gameStatusText').innerText = "FLEW AWAY @ " + currentMultiplier.toFixed(2) + 'x';
                }
            }
        }
        setInterval(runGameEngine, 150);
        updateUI();
    </script>
</body>
</html>
