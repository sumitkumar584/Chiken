<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; background-color: #07090e; color: #fff; }</style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-md w-full space-y-4">
        <!-- Admin Header -->
        <div class="bg-[#121622] border border-gray-800 p-4 rounded-2xl flex justify-between items-center shadow-xl">
            <h1 class="text-lg font-black text-red-500 flex items-center"><i class="fa-solid fa-shield-halved mr-2"></i>Admin Portal</h1>
            <span class="text-xs bg-green-900 text-green-300 px-2.5 py-1 rounded-full font-bold">Live</span>
        </div>

        <!-- Key Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#121622] border border-gray-800 p-3.5 rounded-2xl shadow-lg">
                <div class="text-xs text-gray-400 font-semibold">Total Registered Users</div>
                <div id="adminUsersCount" class="text-2xl font-black text-white mt-1">142</div>
            </div>
            <div class="bg-[#121622] border border-gray-800 p-3.5 rounded-2xl shadow-lg">
                <div class="text-xs text-gray-400 font-semibold">Platform Revenue</div>
                <div id="adminRevenue" class="text-2xl font-black text-green-400 mt-1">₹48,200</div>
            </div>
        </div>

        <!-- Game Crash Multiplier Control -->
        <div class="bg-[#121622] border border-gray-800 p-4 rounded-2xl space-y-3 shadow-xl">
            <h2 class="text-sm font-bold text-gray-300 flex items-center"><i class="fa-solid fa-sliders mr-2 text-indigo-400"></i>Game Crash Control</h2>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Set Next Crash Multiplier</label>
                <div class="flex space-x-2">
                    <input type="number" id="crashInput" step="0.1" value="2.00" class="flex-grow bg-[#1b2230] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-sm">
                    <button onclick="updateCrash()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold shadow">Apply</button>
                </div>
            </div>
        </div>

        <!-- Pending Withdrawals Management -->
        <div class="bg-[#121622] border border-gray-800 p-4 rounded-2xl space-y-3 shadow-xl">
            <h2 class="text-sm font-bold text-gray-300 flex items-center"><i class="fa-solid fa-money-check-dollar mr-2 text-yellow-400"></i>Pending Withdrawals</h2>
            <div class="space-y-2" id="withdrawalList">
                <div class="bg-[#1b2230] p-3 rounded-xl border border-gray-700 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-bold text-white">₹1,500 - user@gmail.com</div>
                        <div class="text-gray-400 text-[10px]">UPI: user@okaxis</div>
                    </div>
                    <div class="space-x-1">
                        <button onclick="approveWithdraw(this)" class="bg-green-600 px-2.5 py-1 rounded-lg font-bold text-white">Approve</button>
                        <button onclick="rejectWithdraw(this)" class="bg-red-600 px-2.5 py-1 rounded-lg font-bold text-white">Reject</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCrash() {
            const val = document.getElementById('crashInput').value;
            alert("Next crash multiplier updated to " + val + "x successfully!");
        }
        function approveWithdraw(btn) {
            btn.parentElement.parentElement.remove();
            alert("Withdrawal Approved & Processed!");
        }
        function rejectWithdraw(btn) {
            btn.parentElement.parentElement.remove();
            alert("Withdrawal Rejected!");
        }
    </script>
</body>
</html>
